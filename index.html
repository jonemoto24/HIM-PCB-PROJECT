<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Reporte - PCB Electronics</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Centrar todo el contenido vertical y horizontalmente */
        .seccion-principal {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px); /* Ajusta según la altura de tu header */
            padding: 20px;
            box-sizing: border-box;
        }

        .panel-izquierdo {
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease-in-out;
        }

        .panel-izquierdo:hover {
            transform: scale(1.05);
        }

        /* Hacer la tarjeta del formulario más grande y centrada */
        .panel-derecho {
            display: none; 
            width: 100%;
            max-width: 550px; /* Tamaño más amplio para el cuadro */
        }

        /* Cuando está activo se muestra centrado */
        .panel-derecho.activo {
            display: block;
        }

        /* Aumentar tamaño de letra y espacio dentro de la tarjeta */
        .card-form {
            padding: 25px;
            font-size: 1.1rem;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* Clase para ocultar completamente el logo */
        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>MALAMEN PCB</h1>
    </header>

    <main class="main-container">
        <div class="seccion-principal">
            <!-- Panel con la imagen inicial -->
            <div class="panel-izquierdo" id="panelLogo">
                <img src="logo_PCB.jpg" alt="Haz clic aquí para ingresar datos" class="imagen-banner" width="300">
            </div>

            <!-- Panel con el formulario ampliado y centrado -->
            <div class="panel-derecho" id="panelFormulario">
                <div class="card-form">
                    <form id="reporteForm">
                        <fieldset>
                            <legend>Datos del usuario</legend>

                            <div class="campo">
                                <label for="nomina">No. Nómina:</label>
                                <input type="text" id="nomina" name="nomina" required autocomplete="off">
                            </div>

                            <div class="campo">
                                <label for="password">Contraseña:</label>
                                <input type="password" id="password" name="password" required>
                            </div>

                            <div class="campo">
                                <label for="area">Área:</label>
                                <input list="listaAreas" id="area" name="area" placeholder="Selecciona área" required>
                                <datalist id="listaAreas">
                                    <option value="Producción"></option>
                                    <option value="Mantenimiento"></option>
                                </datalist>
                            </div>
                        </fieldset>

                        <div class="botones-contenedor">
                            <button type="button" id="btnCancelar" class="btn btn-cancelar">Cancelar</button>
                            <button type="submit" id="btnFolio" class="btn btn-aceptar">Aceptar</button>
                        </div>
                        <p id="mensajeAcceso" role="status" aria-live="polite" style="color: red; margin-top: 10px;"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reporteForm = document.getElementById('reporteForm');
            const mensajeAcceso = document.getElementById('mensajeAcceso');
            const btnFolio = document.getElementById('btnFolio');
            const panelLogo = document.getElementById('panelLogo');
            const panelFormulario = document.getElementById('panelFormulario');
            let usuariosAutorizados = [];

            // Oculta el logo y muestra el formulario centrado
            panelLogo.addEventListener('click', () => {
                panelLogo.classList.add('oculto');
                panelFormulario.classList.add('activo');
            });

            const cargarUsuarios = async () => {
                try {
                    const response = await fetch('Acceso.json');
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status}`);
                    }

                    const data = await response.json();

                    if (Array.isArray(data)) {
                        usuariosAutorizados = data;
                    } else {
                        throw new Error('El archivo Acceso.json no contiene una lista válida.');
                    }
                } catch (error) {
                    console.error('Error al cargar Acceso.json:', error);
                    mensajeAcceso.textContent = 'Atención: No se pudo cargar la base de datos de usuarios.';
                }
            };

            const validarCredenciales = (nomina, password) => {
                const nominaLimpia = String(nomina).trim();
                const passwordLimpia = String(password).trim();

                return usuariosAutorizados.some(usuario => {
                    const nominaBD = String(usuario["No. Nomina"] || usuario.nomina || '').trim();
                    const passwordBD = String(usuario["Contraseña"] || usuario.password || '').trim();
                    const estaConfirmado = usuario["Confirmado"] === true;

                    return estaConfirmado && nominaBD === nominaLimpia && passwordBD === passwordLimpia;
                });
            };

            cargarUsuarios();

            // Restaurar estado inicial al cancelar
            document.getElementById('btnCancelar').addEventListener('click', () => {
                reporteForm.reset();
                mensajeAcceso.textContent = '';
                panelFormulario.classList.remove('activo');
                panelLogo.classList.remove('oculto');
            });

            reporteForm.addEventListener('submit', (event) => {
                event.preventDefault();
                mensajeAcceso.textContent = '';

                const nomina = document.getElementById('nomina').value;
                const password = document.getElementById('password').value;

                if (usuariosAutorizados.length === 0) {
                    mensajeAcceso.textContent = 'Los datos de acceso aún no están disponibles.';
                    return;
                }

                if (validarCredenciales(nomina, password)) {
                    mensajeAcceso.style.color = 'green';
                    mensajeAcceso.textContent = 'Acceso concedido. Redireccionando...';

                    setTimeout(() => {
                        window.location.href = 'secundario.html';
                    }, 800);
                } else {
                    mensajeAcceso.style.color = 'red';
                    mensajeAcceso.textContent = 'Nómina o contraseña incorrecta.';
                }
            });
        });
    </script>
</body>
</html>
