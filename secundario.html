<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de dispositivos - PCB Electronics</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dispositivos {
            width: min(1100px, 95%);
            margin: 30px auto;
            padding: 28px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #d5dbe1;
            border-radius: 12px;
            box-shadow: 0 4px 14px #00000014;
        }
        .dispositivos h2 { text-align: center; margin-top: 0; }
        .rejilla-dispositivos {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }
        .tarjeta-dispositivo {
            padding: 14px;
            text-align: center;
            border: 1px solid #d5dbe1;
            border-radius: 8px;
        }
        .tarjeta-dispositivo img {
            display: block;
            width: 100%;
            height: 180px;
            margin-bottom: 12px;
            object-fit: contain;
        }
        .tarjeta-dispositivo label { display: block; margin-bottom: 8px; font-weight: 600; }
        .tarjeta-dispositivo input {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .acciones { margin-top: 22px; text-align: center; }

        /* ESTILOS MODAL */
        #modalReconfirmacion {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-contenido {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #475569;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-contenido h3 { margin-bottom: 15px; margin-top: 0; }
        .modal-contenido p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .modal-contenido input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0f172a;
            border: 1px solid #64748b;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .modal-botones {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-modal-cancelar {
            flex: 1;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-modal-confirmar {
            flex: 1;
            padding: 10px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .mensaje-estado {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }

        @media (max-width: 800px) {
            .rejilla-dispositivos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 480px) {
            .rejilla-dispositivos { grid-template-columns: 1fr; }
            .dispositivos { padding: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>MALAMEN PCB</h1>
    </header>

    <main class="dispositivos">
        <h2>Selecciona la cantidad de placas para cada dispositivo</h2>
        <form id="tareaForm">
            <div class="rejilla-dispositivos">
                <div class="tarjeta-dispositivo">
                    <img src="bocina_Si.avif" alt="Imagen del dispositivo 1">
                    <label for="cantidad1">Bocinas</label>
                    <input type="number" id="cantidad1" name="dispositivo1" min="0" step="1" value="0">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="Camara.avif" alt="Imagen del dispositivo 2">
                    <label for="cantidad2">Cámara</label>
                    <input type="number" id="cantidad2" name="dispositivo2" min="0" step="1" value="0">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="Pantalla_Com.png" alt="Imagen del dispositivo 3">
                    <label for="cantidad3">Pantalla</label>
                    <input type="number" id="cantidad3" name="dispositivo3" min="0" step="1" value="0">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="personalizado.png" alt="Imagen del dispositivo personalizado">
                    <label for="cantidadPersonalizado">Dispositivo personalizado</label>
                    <input type="number" id="cantidadPersonalizado" name="dispositivoPersonalizado" min="0" step="1" value="0">
                </div>
            </div>
            <div class="acciones">
                <button type="submit" class="btn btn-aceptar">Aceptar tarea</button>
            </div>
        </form>
    </main>

    <!-- VENTANA MODAL DE RECONFIRMACIÓN -->
    <div id="modalReconfirmacion">
        <div class="modal-contenido">
            <h3>Reconfirmar Credenciales</h3>
            <p>Por seguridad, ingresa nuevamente tus datos para autorizar la tarea.</p>
            
            <input type="text" id="modalNomina" placeholder="No. Nómina" autocomplete="off">
            <input type="password" id="modalPassword" placeholder="Contraseña">
            
            <div class="modal-botones">
                <button type="button" id="btnCancelarModal" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btnConfirmarModal" class="btn-modal-confirmar">Confirmar</button>
            </div>

            <p id="mensajeModal" class="mensaje-estado" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script>
        const URL_GOOGLE_SCRIPT = 'https://script.google.com/macros/s/AKfycbw-RI3XSJBBYyCOUG_DyujIpsuNNHId8mgxkBDiXbF21X9-MDhwYM_bMb7SJQ79-Mei/exec';

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('tareaForm');
            const modal = document.getElementById('modalReconfirmacion');
            const btnCancelarModal = document.getElementById('btnCancelarModal');
            const btnConfirmarModal = document.getElementById('btnConfirmarModal');
            const mensajeModal = document.getElementById('mensajeModal');

            const inputNomina = document.getElementById('modalNomina');
            const inputPassword = document.getElementById('modalPassword');

            let usuariosAutorizados = [];

            const cargarUsuarios = async () => {
                try {
                    const response = await fetch('Acceso.json');
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    const data = await response.json();
                    if (Array.isArray(data)) usuariosAutorizados = data;
                } catch (error) {
                    console.error('Error al cargar Acceso.json:', error);
                }
            };

            cargarUsuarios();

            const validarCredenciales = (nomina, password) => {
                const nominaLimpia = String(nomina).trim();
                const passwordLimpia = String(password).trim();

                return usuariosAutorizados.some(usuario => {
                    const nominaBD = String(usuario["No. Nomina"] || usuario.nomina || '').trim();
                    const passwordBD = String(usuario["Contraseña"] || usuario.password || '').trim();
                    const estaConfirmado = usuario["Confirmado"] === true;

                    return estaConfirmado && nominaBD === nominaLimpia && passwordBD === passwordLimpia;
                });
            };

            // Envío optimizado para Google Apps Script usando URLSearchParams
            const guardarEnGoogleSheets = async (datosProduccion) => {
                try {
                    const params = new URLSearchParams();
                    for (const key in datosProduccion) {
                        params.append(key, datosProduccion[key]);
                    }

                    await fetch(URL_GOOGLE_SCRIPT, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: params.toString()
                    });
                    return true;
                } catch (error) {
                    console.error('Error enviando a Google Sheets:', error);
                    return false;
                }
            };

            form.addEventListener('submit', (evento) => {
                evento.preventDefault();
                const cantidades = [...document.querySelectorAll('.tarjeta-dispositivo input')];
                
                if (!cantidades.some((campo) => Number(campo.value) > 0)) {
                    alert('Indica una cantidad mayor que cero para al menos un dispositivo.');
                    return;
                }

                inputNomina.value = '';
                inputPassword.value = '';
                mensajeModal.textContent = '';
                btnConfirmarModal.disabled = false;
                btnCancelarModal.disabled = false;

                modal.style.display = 'flex';
            });

            btnCancelarModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            btnConfirmarModal.addEventListener('click', async () => {
                const nominaModal = inputNomina.value.trim();
                const passwordModal = inputPassword.value.trim();

                if (!nominaModal || !passwordModal) {
                    mensajeModal.style.color = '#ef4444';
                    mensajeModal.textContent = 'Por favor, ingresa tu nómina y contraseña.';
                    return;
                }

                if (usuariosAutorizados.length === 0) {
                    mensajeModal.style.color = '#ef4444';
                    mensajeModal.textContent = 'No se pudo verificar la base de datos de usuarios.';
                    return;
                }

                if (validarCredenciales(nominaModal, passwordModal)) {
                    btnConfirmarModal.disabled = true;
                    btnCancelarModal.disabled = true;
                    mensajeModal.style.color = '#38bdf8';
                    mensajeModal.textContent = 'Guardando datos en la nube...';

                    const datosProduccion = {
                        nomina: nominaModal,
                        bocinas: document.getElementById('cantidad1').value || 0,
                        camaras: document.getElementById('cantidad2').value || 0,
                        pantallas: document.getElementById('cantidad3').value || 0,
                        personalizado: document.getElementById('cantidadPersonalizado').value || 0
                    };

                    await guardarEnGoogleSheets(datosProduccion);

                    mensajeModal.style.color = '#22c55e';
                    let tiempoRestante = 5;
                    mensajeModal.textContent = `¡Tarea registrada con éxito! Redirigiendo en ${tiempoRestante}s...`;

                    const temporizador = setInterval(() => {
                        tiempoRestante -= 1;
                        if (tiempoRestante > 0) {
                            mensajeModal.textContent = `¡Tarea registrada con éxito! Redirigiendo en ${tiempoRestante}s...`;
                        } else {
                            clearInterval(temporizador);
                            window.location.href = 'index.html';
                        }
                    }, 1000);

                } else {
                    mensajeModal.style.color = '#ef4444';
                    mensajeModal.textContent = 'Nómina o contraseña incorrecta.';
                }
            });
        });
    </script>
</body>
</html>
