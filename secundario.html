<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de dispositivos - PCB Electronics</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dispositivos {
            width: min(1100px, 95%);
            margin: 30px auto;
            padding: 28px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #d5dbe1;
            border-radius: 12px;
            box-shadow: 0 4px 14px #00000014;
        }
        .dispositivos h2 { text-align: center; margin-top: 0; }
        .rejilla-dispositivos {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }
        .tarjeta-dispositivo {
            padding: 14px;
            text-align: center;
            border: 1px solid #d5dbe1;
            border-radius: 8px;
        }
        .tarjeta-dispositivo img {
            display: block;
            width: 100%;
            height: 180px;
            margin-bottom: 12px;
            object-fit: contain;
        }
        .tarjeta-dispositivo label { display: block; margin-bottom: 8px; font-weight: 600; }
        .tarjeta-dispositivo input {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .acciones { margin-top: 22px; text-align: center; }

        /* ESTILOS PARA LA VENTANA MODAL DE RECONFIRMACIÓN */
        #modalReconfirmacion {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-contenido {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #475569;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-contenido h3 { margin-bottom: 15px; margin-top: 0; }
        .modal-contenido p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .modal-contenido input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0f172a;
            border: 1px solid #64748b;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .modal-botones {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-modal-cancelar {
            flex: 1;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-modal-confirmar {
            flex: 1;
            padding: 10px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .rejilla-dispositivos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 480px) {
            .rejilla-dispositivos { grid-template-columns: 1fr; }
            .dispositivos { padding: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>MALAMEN PCB</h1>
    </header>

    <main class="dispositivos">
        <h2>Selecciona la cantidad de placas para cada dispositivo</h2>
        <form id="tareaForm">
            <div class="rejilla-dispositivos">
                <div class="tarjeta-dispositivo">
                    <img src="bocina_Si.avif" alt="Imagen del dispositivo 1">
                    <label for="cantidad1">Bocinas</label>
                    <input type="number" id="cantidad1" name="dispositivo1" min="0" step="1" value="0" aria-label="Cantidad de placas para dispositivo 1">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="Camara.avif" alt="Imagen del dispositivo 2">
                    <label for="cantidad2">Cámara</label>
                    <input type="number" id="cantidad2" name="dispositivo2" min="0" step="1" value="0" aria-label="Cantidad de placas para dispositivo 2">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="Pantalla_Com.png" alt="Imagen del dispositivo 3">
                    <label for="cantidad3">Pantalla</label>
                    <input type="number" id="cantidad3" name="dispositivo3" min="0" step="1" value="0" aria-label="Cantidad de placas para dispositivo 3">
                </div>
                <div class="tarjeta-dispositivo">
                    <img src="personalizado.png" alt="Imagen del dispositivo personalizado">
                    <label for="cantidadPersonalizado">Dispositivo personalizado</label>
                    <input type="number" id="cantidadPersonalizado" name="dispositivoPersonalizado" min="0" step="1" value="0" aria-label="Cantidad de placas para dispositivo personalizado">
                </div>
            </div>
            <div class="acciones">
                <button type="submit" class="btn btn-aceptar">Aceptar tarea</button>
            </div>
        </form>
    </main>

    <!-- VENTANA MODAL DE RECONFIRMACIÓN -->
    <div id="modalReconfirmacion">
        <div class="modal-contenido">
            <h3>Reconfirmar Credenciales</h3>
            <p>Por seguridad, ingresa nuevamente tus datos para autorizar la tarea.</p>
            
            <input type="text" id="modalNomina" placeholder="No. Nómina">
            <input type="password" id="modalPassword" placeholder="Contraseña">
            
            <div class="modal-botones">
                <button type="button" id="btnCancelarModal" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btnConfirmarModal" class="btn-modal-confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('tareaForm');
        const modal = document.getElementById('modalReconfirmacion');
        const btnCancelarModal = document.getElementById('btnCancelarModal');
        const btnConfirmarModal = document.getElementById('btnConfirmarModal');

        // 1. Cuando hacen clic en "Aceptar tarea"
        form.addEventListener('submit', (evento) => {
            evento.preventDefault();
            const cantidades = [...document.querySelectorAll('.tarjeta-dispositivo input')];
            
            if (!cantidades.some((campo) => Number(campo.value) > 0)) {
                alert('Indica una cantidad mayor que cero para al menos un dispositivo.');
                return;
            }

            // Si todo está bien, mostramos la ventana modal en lugar de terminar directo
            modal.style.display = 'flex';
        });

        // 2. Botón cancelar de la ventana modal
        btnCancelarModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 3. Botón confirmar dentro de la ventana modal
        btnConfirmarModal.addEventListener('click', () => {
            const nominaModal = document.getElementById('modalNomina').value.trim();
            const passwordModal = document.getElementById('modalPassword').value.trim();

            if (nominaModal === "" || passwordModal === "") {
                alert('Por favor, ingresa tu número de nómina y contraseña.');
                return;
            }

            // Aquí puedes realizar el envío final o validación que necesites
            alert('¡Tarea reconfirmada y autorizada con éxito!');
            modal.style.display = 'none';
            
            // Opcional: limpiar campos o enviar datos al servidor / ESP32
            form.reset();
        });
    </script>
</body>
</html>
